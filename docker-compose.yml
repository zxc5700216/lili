services:
  postgres:
    image: postgres:16
    container_name: duobaoyu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: duobaoyu
      POSTGRES_PASSWORD: duobaoyu
      POSTGRES_DB: duobaoyu
    ports:
      - "54329:5432"
    volumes:
      - duobaoyu_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duobaoyu -d duobaoyu"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  duobaoyu_pg:
